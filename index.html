
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parkrun A-Z</title>

    <style>

        /* ------------------------------
           GENERAL PAGE
        ------------------------------ */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: rgb(85, 107, 47);
            background: #b2d9be;
            
        }

        h1 {
            text-align: center;
            margin: 0 0 30px 0;
        }


        /* ------------------------------
           PHOTO GRID
        ------------------------------ */

        .gallery {
            display: grid;

            /* Automatically adjusts columns */
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 18px;

            max-width: 1400px;
            margin: 0 auto;
        }


        /* Each photo sits inside its own box */

        .photo {
            background: darkolivegreen;
            padding: 6px;
            border-radius: 8px;

            cursor: pointer;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* The actual photograph */

        .photo img {
            width: 100%;
            height: auto;

            display: block;

            border-radius: 5px;
        }


        /* Slight effect when hovering over a photograph */

        .photo:hover {
            transform: scale(1.02);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.25);
        }


        /* ------------------------------
           LIGHTBOX
        ------------------------------ */

        .lightbox {
            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.92);

            align-items: center;
            justify-content: center;
        }


        /* The large photograph */

        .lightbox-image {
            max-width: 90%;
            max-height: 90vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 4px;

            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.5);
        }


        /* ------------------------------
           CLOSE BUTTON
        ------------------------------ */

        .close {
            position: absolute;

            top: 20px;
            right: 35px;

            color: white;

            font-size: 45px;
            font-weight: bold;

            cursor: pointer;

            line-height: 1;

            z-index: 1002;
        }

        .close:hover {
            color: #ccc;
        }


        /* ------------------------------
           PREVIOUS / NEXT BUTTONS
        ------------------------------ */

        .prev,
        .next {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            color: white;

            font-size: 45px;

            font-weight: bold;

            cursor: pointer;

            padding: 20px;

            user-select: none;

            z-index: 1002;
        }


        .prev {
            left: 10px;
        }


        .next {
            right: 10px;
        }


        .prev:hover,
        .next:hover {
            color: #ccc;
        }


        /* ------------------------------
           PHOTO NUMBER
        ------------------------------ */

        .photo-number {
            position: absolute;

            bottom: 15px;

            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 16px;

            background: rgba(0, 0, 0, 0.5);

            padding: 6px 12px;

            border-radius: 20px;
        }


        /* ------------------------------
           SMALL SCREENS
        ------------------------------ */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .photo {
                padding: 3px;
                border-radius: 5px;
            }

            .photo img {
                border-radius: 3px;
            }

            .prev,
            .next {
                font-size: 35px;
                padding: 10px;
            }

            .close {
                top: 15px;
                right: 20px;
                font-size: 35px;
            }

            .lightbox-image {
                max-width: 94%;
                max-height: 85vh;
            }
        }

    </style>
</head>

    <script>

        /* Get all the photographs */

        const photos =
            document.querySelectorAll('.photo img');


        /* Get the lightbox elements */

        const lightbox =
            document.getElementById('lightbox');

        const lightboxImage =
            document.getElementById('lightboxImage');

        const closeButton =
            document.getElementById('close');

        const previousButton =
            document.getElementById('prev');

        const nextButton =
            document.getElementById('next');

        const photoNumber =
            document.getElementById('photoNumber');


        /* Keep track of which photo is being displayed */

        let currentPhoto = 0;


        /* ---------------------------------
           OPEN LIGHTBOX
           --------------------------------- */

        function openLightbox(index) {

            currentPhoto = index;

            showPhoto();

            lightbox.style.display = 'flex';

            /* Prevent the page underneath from scrolling */

            document.body.style.overflow = 'hidden';
        }


        /* ---------------------------------
           DISPLAY PHOTO
           --------------------------------- */

        function showPhoto() {

            const photo = photos[currentPhoto];

            lightboxImage.src = photo.src;

            lightboxImage.alt = photo.alt;

            photoNumber.textContent =
                (currentPhoto + 1) + ' / ' + photos.length;
        }


        /* ---------------------------------
           CLOSE LIGHTBOX
           --------------------------------- */

        function closeLightbox() {

            lightbox.style.display = 'none';

            document.body.style.overflow = '';
        }


        /* ---------------------------------
           NEXT PHOTO
           --------------------------------- */

        function nextPhoto() {

            currentPhoto++;

            /* Go back to first photo */

            if (currentPhoto >= photos.length) {
                currentPhoto = 0;
            }

            showPhoto();
        }


        /* ---------------------------------
           PREVIOUS PHOTO
           --------------------------------- */

        function previousPhoto() {

            currentPhoto--;

            /* Go to last photo */

            if (currentPhoto < 0) {
                currentPhoto = photos.length - 1;
            }

            showPhoto();
        }


        /* ---------------------------------
           CLICK ON A THUMBNAIL
           --------------------------------- */

        photos.forEach(function(photo, index) {

            photo.addEventListener('click', function() {

                openLightbox(index);

            });

        });


        /* ---------------------------------
           BUTTONS
           --------------------------------- */

        closeButton.addEventListener(
            'click',
            closeLightbox
        );

        nextButton.addEventListener(
            'click',
            nextPhoto
        );

        previousButton.addEventListener(
            'click',
            previousPhoto
        );


        /* ---------------------------------
           CLICK OUTSIDE PHOTO TO CLOSE
           --------------------------------- */

        lightbox.addEventListener(
            'click',
            function(event) {

                if (event.target === lightbox) {

                    closeLightbox();

                }

            }
        );


        /* ---------------------------------
           KEYBOARD CONTROLS
           --------------------------------- */

        document.addEventListener(
            'keydown',
            function(event) {

                /* Only respond when lightbox is open */

                if (lightbox.style.display !== 'flex') {
                    return;
                }


                /* Right arrow */

                if (event.key === 'ArrowRight') {

                    nextPhoto();

                }


                /* Left arrow */

                if (event.key === 'ArrowLeft') {

                    previousPhoto();

                }


                /* Escape */

                if (event.key === 'Escape') {

                    closeLightbox();

                }

            }
        );

    </script>
