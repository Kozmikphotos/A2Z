<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Parkrun A to Z</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; }
  header { background: #2b2b6b; color: white; padding: 20px; text-align: center; height: 50px; }
  header h1 { margin: 0; line-height: 50px; }
  nav { position: fixed; top: 90px; left: 0; width: 50px; bottom: 0; background: #ffa300; overflow-y: auto; text-align: center; }
  nav a { display: block; padding: 6px 0; color: #2b2b6b; font-weight: bold; text-decoration: none; }
  nav a:hover { background: #2b2b6b; color: white; }
  main { margin-left: 70px; padding: 20px; }
  section { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; scroll-margin-top: 100px; }
  section h2 { margin-top: 0; color: #2b2b6b; border-bottom: 3px solid #ffa300; }
  .gallery { display: flex; flex-wrap: wrap; gap: 15px; }
  figure { margin: 0; width: 220px; }
  figure img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; background: #ddd; cursor: pointer; }
  figcaption { text-align: center; padding-top: 5px; font-size: 14px; }
  .empty { color: #888; font-style: italic; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 10; }
  #lightbox img { max-width: 90%; max-height: 90%; border-radius: 6px; }
</style>
</head>
<body>

<header><h1>My Parkrun A to Z</h1></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="lightbox" onclick="this.style.display='none'"><img id="big" alt=""></div>

<script>
// ============================================================
// EDIT THIS LIST to add your photos.
// 1. Put the photo files in a folder called photos next to this page.
// 2. Under the right letter, add a line:  ["file name.jpg", "Parkrun name"],
// Keep the commas and quote marks exactly as shown.
// ============================================================
const photos = {
  A: [
    ["1.JPG", "Alexandra "],
  ],
  B: [
    ["2.jpg", "Birkenhead"],
    ["Barrow.jpg", "Barrow in Furness"],
    ["Blackpool.JPG", "Blackpool"],
    
  ],
  C: [
    ["3.jpg", "Clermont, FL"],
    ["cun.jpg", "Cuningar Loop"],
  ],
  D: [
    ["4.jpg", "Delamere"],
  ],
  E: [
    ["5.JPG", "Edgbaston"],
  ],
  F: [
    ["6.JPG", "Fell Foot"],
  ],
  G: [
    ["7.jpeg", "Greenfield Valley"]
  ],
  H: [
    ["8.jpg", "Holyrood"],
    ["Haigh.jpg", "Haigh Woodland"],
  ],
  I: [
    ["9.jpg", "Isabel Trail"],
  ],
  J: [],
  K: [
    ["11.jpg", "Keswick"],
  ],
  L: [
    ["12.jpg", "Lancaster"],
    ["lytham.jpg", "Lytham Hall"],
    ["Lews.jpeg", "Lews Castle"],
  ],
  M: [
    ["13.jpg", "Malahide, IRL"],
   ["IMG_0428.JPG", "Morecambe"], 
  ],
  N: [
    ["14.JPG", "Nobles, IOM"],
    
  ],
  O: [],
  P: [
    ["16.jpg", "Penrith"],
    ["IMG_4096.JPG", "Princes"],
    ["IMG_0432.JPG", "Preston"],
  ],
  Q: [
    ["17.jpeg", "Queens, Glasgow"],
  ],
  R: [
    ["18.JPG", "Rothay"],
  ],
  S: [
    ["sou.jpeg", "Southampton" ],
    ["strat.jpg", "Starford-Upon-Avon"],
    ["sp.jpg", "Southport"],

  ],
  T: [],
  U: [],
  V: [
    ["22.jpg", "Victoria, Glasgow"],
  ],
  W: [
    ["23.jpg", "Worsley Woods"],
    ["IMG_0295.jpg", "Whinlatter Forest"],
    ["word.JPG", "Worden"],
    ["wit.jpg", "Witton"],
  ],
  X: [
    ["x.jpg"]
  ],
  Y: [],
  Z: [
    ["Zuid.jpg", "Zuiderpark, Netherlands"]
  ]
};
// ============================================================

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const nav = document.getElementById("nav");
const main = document.getElementById("main");

letters.forEach(L => {
  const a = document.createElement("a");
  a.href = "#" + L;
  a.textContent = L;
  nav.appendChild(a);

  const sec = document.createElement("section");
  sec.id = L;
  sec.innerHTML = "<h2>" + L + "</h2>";
  const gallery = document.createElement("div");
  gallery.className = "gallery";

  const list = photos[L] || [];
  if (list.length === 0) {
    gallery.innerHTML = '<p class="empty">No photos yet</p>';
  }
  list.forEach(([file, name]) => {
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.src = file;
    img.alt = name;
    img.loading = "lazy";
    img.onclick = () => {
      document.getElementById("big").src = img.src;
      document.getElementById("lightbox").style.display = "flex";
    };
    const cap = document.createElement("figcaption");
    cap.textContent = name;
    fig.append(img, cap);
    gallery.appendChild(fig);
  });

  sec.appendChild(gallery);
  main.appendChild(sec);
});
</script>
</body>
</html>
